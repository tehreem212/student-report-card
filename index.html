<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Student Report Card</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="card">
        <h2>Student Report Card</h2>
        <label>Name:</label>
        <input type="text" id="name" />
        <label>Class:</label>
        <input type="text" id="class" />
        <label>Roll No:</label>
        <input type="text" id="roll" />
        <label>English Marks:</label>
        <input type="number" id="marks1" min="0" max="100"/>
        <label>Urdu Marks:</label>
        <input type="number" id="marks2" min="0" max="100"/>
        <label>Maths Marks:</label>
        <input type="number" id="marks3" min="0" max="100"/>
        <label>Computer Marks:</label>
        <input type="number" id="marks4" min="0" max="100"/>
        <label>Programming Marks:</label>
        <input type="number" id="marks5" min="0" max="100"/>
        <button onclick="generateReport()">Generate Report</button>
        <div id="report" class="report-box">
            <h3>Generated Report</h3>
            <p><strong>Name:</strong> <span id="rName"></span></p>
            <p><strong>Class:</strong> <span id="rClass"></span></p>
            <p><strong>Roll No:</strong> <span id="rRoll"></span></p>
            <p><strong>English Marks:</strong> <span id="rM1"></span></p>
            <p><strong>Urdu Marks:</strong> <span id="rM2"></span></p>
            <p><strong>Maths Marks:</strong> <span id="rM3"></span></p>
            <p><strong>Computer Marks:</strong> <span id="rM4"></span></p>
            <p><strong>Programming Marks:</strong> <span id="rM5"></span></p>
            <p><strong>Total Marks:</strong> 500</p>
            <p><strong>Marks Obtained:</strong> <span id="obtained"></span></p>
            <p><strong>Percentage:</strong> <span id="percent"></span>%</p>
            <p><strong>Grade:</strong> <span id="grade"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
